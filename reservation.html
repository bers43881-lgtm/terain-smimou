{% extends "base.html" %}
{% block title %}Réserver – Terrain Smimou{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card p-4">
            <h4 class="fw-bold mb-4"><i class="bi bi-calendar-plus me-2 text-success"></i>Nouvelle Réservation</h4>
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Nom complet <span class="text-danger">*</span></label>
                        <input type="text" name="nom" class="form-control" placeholder="Votre nom" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Téléphone <span class="text-danger">*</span></label>
                        <input type="tel" name="telephone" class="form-control" placeholder="06XXXXXXXX" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Date <span class="text-danger">*</span></label>
                        <input type="date" name="date_reservation" class="form-control" required min="{{ today }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Heure début <span class="text-danger">*</span></label>
                        <select name="heure_debut" class="form-select" required>
                            <option value="">--</option>
                            {% for h in ['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00'] %}
                            <option>{{ h }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Heure fin <span class="text-danger">*</span></label>
                        <select name="heure_fin" class="form-select" required>
                            <option value="">--</option>
                            {% for h in ['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00'] %}
                            <option>{{ h }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Sport <span class="text-danger">*</span></label>
                        <select name="sport" class="form-select" required>
                            <option value="">-- Choisir un sport --</option>
                            <option>Football</option>
                            <option>Basketball</option>
                            <option>Volleyball</option>
                            <option>Tennis</option>
                            <option>Handball</option>
                            <option>Autre</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Notes (optionnel)</label>
                        <textarea name="notes" class="form-control" rows="2" placeholder="Informations supplémentaires…"></textarea>
                    </div>
                    <div class="col-12 mt-2">
                        <button type="submit" class="btn btn-green px-4 py-2 fw-bold">
                            <i class="bi bi-send me-1"></i>Envoyer la réservation
                        </button>
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary ms-2">Annuler</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
{% block scripts %}
<script>
document.querySelector('[name="date_reservation"]').min = new Date().toISOString().split('T')[0];
</script>
{% endblock %}
