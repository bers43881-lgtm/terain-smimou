{% extends "base.html" %}
{% block title %}{{ t.admin_space }} – Terrain Smimou{% endblock %}
{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4">
            <div class="text-center mb-4">
                <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                     style="width:64px;height:64px;background:#e8f5e9;">
                    <i class="bi bi-shield-lock-fill text-success fs-3"></i>
                </div>
                <h4 class="fw-bold">{{ t.admin_space }}</h4>
                <p class="text-muted small">{{ t.admin_subtitle }}</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ t.username_label }}</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control"
                               placeholder="{{ t.username_ph }}" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">{{ t.password_label }}</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" class="form-control"
                               placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-green w-100 py-2 fw-bold">
                    <i class="bi bi-box-arrow-in-right me-1"></i>{{ t.connect_btn }}
                </button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
