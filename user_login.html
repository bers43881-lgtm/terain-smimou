{% extends "base.html" %}
{% block title %}Connexion – Terrain Smimou{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4 mt-3">
            <div class="text-center mb-4">
                <i class="bi bi-person-circle text-success" style="font-size:3rem;"></i>
                <h4 class="fw-bold mt-2">{{ t.login_title }}</h4>
                <small class="text-muted">{{ t.login_sub }}</small>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ t.username_label }}</label>
                    <input type="text" name="username" class="form-control"
                           placeholder="{{ t.username_ph }}" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">{{ t.password_label }}</label>
                    <input type="password" name="password" class="form-control"
                           placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-green w-100 fw-bold py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i>{{ t.connect_btn }}
                </button>
            </form>
            <hr class="my-3">
            <p class="text-center text-muted small mb-0">
                {{ t.no_account }}
                <a href="{{ url_for('user_register') }}" class="text-success fw-semibold">{{ t.register_link }}</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
