{% extends "base.html" %}
{% block title %}Inscription – Terrain Smimou{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4 mt-3">
            <div class="text-center mb-4">
                <i class="bi bi-person-plus-fill text-success" style="font-size:3rem;"></i>
                <h4 class="fw-bold mt-2">{{ t.register_title }}</h4>
                <small class="text-muted">{{ t.register_sub }}</small>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ t.username_label }} <span class="text-danger">*</span></label>
                    <input type="text" name="username" class="form-control"
                           placeholder="{{ t.username_ph }}" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ t.phone }} <span class="text-danger">*</span></label>
                    <input type="tel" name="telephone" class="form-control"
                           placeholder="{{ t.phone_ph }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ t.password_label }} <span class="text-danger">*</span></label>
                    <input type="password" name="password" class="form-control"
                           placeholder="Min. 6 caractères" required minlength="6">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">{{ t.confirm_password }} <span class="text-danger">*</span></label>
                    <input type="password" name="confirm" class="form-control"
                           placeholder="Répétez le mot de passe" required>
                </div>
                <button type="submit" class="btn btn-green w-100 fw-bold py-2">
                    <i class="bi bi-person-check me-1"></i>{{ t.register_btn }}
                </button>
            </form>
            <hr class="my-3">
            <p class="text-center text-muted small mb-0">
                {{ t.have_account }}
                <a href="{{ url_for('user_login') }}" class="text-success fw-semibold">{{ t.login_link }}</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
